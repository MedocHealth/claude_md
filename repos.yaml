# repos.yaml — curated source of truth for the Medoc Health workspace.
#
# WHAT BELONGS HERE: facts only a human knows — is this repo alive, which product
# owns it, which repo supersedes it, what it is coupled to, what will hurt you.
#
# WHAT DOES NOT: versions, npm scripts, architecture, package names, ports that are
# discoverable from source. `scripts/gen-repo-claudemd.mjs` reads those LIVE from each
# repo's manifest at generation time, so they cannot go stale. Do not duplicate them.
#
# Editing this file changes 89 repos' CLAUDE.md. Regenerate and open PRs:
#   node scripts/gen-repo-claudemd.mjs --write
#
# Verified against the working tree 2026-08-28. Repo count: 89 + claude_md.

meta:
  verified: "2026-08-28"
  workspace_repos: 90

# Status vocabulary:
#   canonical — edit here
#   mirror    — shares history with a canonical repo; release-tracking only
#   legacy    — dormant. DO NOT implement here. `live:` names the replacement.
#   artifact  — compiled output, not source. Never hand-edit.
#   stub      — empty or placeholder
#   package   — library consumed by other repos
#
# archived: true — the GitHub repo is archived and READ-ONLY. Nothing can be pushed to it,
# which makes it the strongest possible form of the dormant guard.

products:
  hospital-plus: { name: "Hospital+ (Axon)", persona: "Hospital staff, doctors, admins" }
  medoc-plus:    { name: "Medoc+ (Vigil)",   persona: "Floor staff: nurses, paramedics, pharmacists, phlebotomists (role string + attendance state, no RBAC layer)" }
  docapp:        { name: "DocApp / DocAssist", persona: "Doctors, voice-driven prescribing" }
  me:            { name: "ME (Medoc EUA)",   persona: "Patients / end users" }
  care:          { name: "Care Dashboard",   persona: "NABH accreditation & compliance" }
  abdm:          { name: "ABDM",             persona: "ABHA / national health ID" }
  admin:         { name: "Admin",            persona: "Internal ops" }
  support:       { name: "Support",          persona: "Support agents" }
  outreach:      { name: "Outreach",         persona: "Sales / CRM" }
  campaign:      { name: "Campaign",         persona: "Marketing campaigns" }
  velocity:      { name: "Velocity",         persona: "Internal sprint tracking" }
  website:       { name: "Marketing site",   persona: "Public" }
  medoc-one:     { name: "Medoc One / claims", persona: "Claims management & settlement" }
  platform:      { name: "Platform services", persona: "Shared infrastructure" }
  realtime:      { name: "Realtime / WebSocket", persona: "Chat, notifications, telemedicine" }
  sync:          { name: "Medoc Sync",       persona: "IoT prescription-capture device" }
  radiology:     { name: "Radiology / AI research", persona: "Imaging" }
  blockchain:    { name: "HUUD",             persona: "Hyperledger supply-chain/insurance" }
  encryption:    { name: "Encryption family", persona: "CSFLE / in-transit crypto" }
  packages:      { name: "Packages / libraries", persona: "Shared code" }
  infra:         { name: "Infra / DevOps / data", persona: "Platform engineering" }
  standalone:    { name: "Standalone",       persona: "Not part of the hospital OS" }

# Coupling groups referenced by repos below. Changing a repo in a group obliges you
# to make the corresponding change in the others, or state explicitly why not.
couplings:
  encryption-copies:
    trigger: "you changed encryption/ or kms/"
    also: [me-backend, docApp-backend, medoc_plus_backend]
    why: "these modules are copied between services by design; fix one, fix all"
  tenant-databases:
    trigger: "you changed a collection name or document shape"
    also: [HPlus-Backend, medoc_plus_backend, docApp-backend, me-backend]
    why: "these backends share tenant databases"
  api-contract:
    trigger: "you changed a request/response shape"
    also: [medoc-bruno-api-collections]
    why: "the .bru contract and the feature Readme.md must move with the API"
  jwt-claims:
    trigger: "you changed JWT payload, audience, or claims"
    also: [HPlus-Backend, medoc_plus_backend, docApp-backend, me-backend, admin-dashboard-backend, compliant-dashboard-backend]
    why: "every JWKS-verifying service treats the audience claim as an authorization gate"
  msf-core-consumers:
    trigger: "you changed msf-core"
    also: [admin-dashboard-backend]
    why: "consumers pin by git tag — tag a release, then bump the consumer"

